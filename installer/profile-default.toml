# Samurai OS install profile — default (spec 08)
# The single source of truth both installers produce and samurai-postinstall applies.
# Validation: installer/validate-profile.py — strict allowlist; unknown or unsafe
# values abort the install. Profiles must never carry free-form shell.

version = 1

[system]
hostname = "samurai-vm"
timezone = "UTC"
locale = "en_US.UTF-8"
keyboard = "us"

[disk]
device = "/dev/vda"          # validated: must be a block device path
layout = "erase"             # erase | alongside | manual (M2: erase only)
filesystem = "btrfs"
encryption = true            # LUKS2, default on (spec 08 page 3)
auto_unlock_keyfile = false  # true = VM-TEST AFFORDANCE ONLY: the LUKS key is stored
                             # unencrypted on the ESP (headless boots). The validator
                             # refuses true unless SAMURAI_TEST_AUTOKEY=1 is exported;
                             # real installs keep the passphrase prompt.

[boot]
kernels = ["linux-cachyos", "linux-zen"]   # release default (ADR-0001); tests override to ["linux"]
bootloader = "limine"        # ADR-0003: Limine + snapshot boot (M4); spike pending for Secure Boot

[user]
name = "samurai"
shell = "fish"               # bash|fish|zsh; release default (Genor's pick); tests may override
groups = ["wheel"]          # M2: exactly ["wheel"]; other groups come via samurai apps / toolbox
root_locked = true           # always (spec 09); false is refused

[packages]
# Desktop: KDE Plasma is the default face of Samurai OS (Genor 2026-11-20);
# alternatives gnome/xfce/lxqt/none arrive via the wizard or the toolbox.
desktop = "kde"
browsers = ["firefox"]       # catalog ids in category "browsers"
# Optional catalog apps and @bundles (`samurai apps list`, `samurai apps bundles`).
# Strict allowlist: exact catalog ids only. Online installs apply them at the end;
# offline installs leave a first-boot note with the exact command instead.
# apps = ["firefox", "@gaming", "@dev"]
# Extra packages besides what the sections below select
# (samurai-profile-plan turns the whole profile into one transaction).
install = [
    "samurai-release",
    "samurai-mirrorlist",
    "samurai-keyring",
    "qemu-guest-agent",
    "networkmanager",
    "wpa_supplicant",
]

# Software choices (spec 08 pages 6a and 8-11; docs/plans/profile-schema.md).
# These are the guided installer's defaults; a section left out installs nothing.
[kde]
theme = "breeze"             # otto/scratchy: refused until packaged
monitor_widgets = true
reduced_effects = true

[gaming]
enabled = true
steam = true
heroic = true
gamemode = true
mangohud = true
gamescope = true
proton_ge = true
proton_cachyos = true
wine = true

[development]
python = []                  # any of "3.10", "3.11", "3.12", "3.13"
conda = "miniforge"          # miniforge | none
docker = "group"             # group (root-equivalent) | rootless | none
ai_clis = []
ollama = false

[network]
tailscale = true
reverse_proxy = "none"       # none | caddy | nginx | traefik

[repos]
samurai = true               # these three are fixed; the validator refuses other values
cachyos = true               # [cachyos] is baked into the ISO (linux-cachyos + keyring)
chaotic_aur = true           # ADR-0007
arch_mirror = "auto"         # "auto" = live medium mirrors; or an https URL to pin
                             # (spec 11: Arch archive for update-from-archive testing)

[security]
firewall = "firewalld"       # spec 09 / ADR-0006: deny inbound except DHCPv6 (ssh only with ssh_server)
ssh_server = false

[hardware]
nvidia = "auto"              # auto = install the NVIDIA stack only when an NVIDIA GPU is present
cuda = true                  # CUDA toolkit (4-5 GiB) on Turing (RTX 20) or newer; skipped otherwise
