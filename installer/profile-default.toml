# Samurai OS install profile — default (spec 08)
# The single source of truth both installers produce and samurai-postinstall applies.
# Validation: installer/validate-profile.py — strict allowlist; unknown or unsafe
# values abort the install. Profiles must never carry free-form shell.

version = 1

[system]
hostname = "samurai-vm"
timezone = "UTC"
locale = "en_US.UTF-8"
keyboard = "us"

[disk]
device = "/dev/vda"          # validated: must be a block device path
layout = "erase"             # erase | alongside | manual (M2: erase only)
filesystem = "btrfs"
encryption = true            # LUKS2, default on (spec 08 page 3)
auto_unlock_keyfile = true   # TEST AFFORDANCE ONLY: keyfile on ESP for headless
                             # boots. Real installs keep the passphrase prompt.

[boot]
kernels = ["linux-cachyos", "linux-zen"]   # release default (ADR-0001); tests override to ["linux"]
bootloader = "limine"        # ADR-0003: Limine + snapshot boot (M4); spike pending for Secure Boot

[user]
name = "samurai"
shell = "fish"               # bash|fish|zsh; release default (Genor's pick); tests may override
groups = ["wheel"]
root_locked = true

[packages]
# Desktop: KDE Plasma is the default face of Samurai OS (Genor 2026-11-20);
# alternatives gnome/xfce/lxqt/none arrive via the wizard or the toolbox.
desktop = "kde"
# Optional catalog apps and @bundles (`samurai apps list`, `samurai apps bundles`).
# Strict allowlist: exact catalog ids only. Online installs apply them at the end;
# offline installs leave a first-boot note with the exact command instead.
# apps = ["firefox", "@gaming", "@dev"]
# M2 install set: enough for a booting, testable system. Desktop/gaming/dev
# packages arrive with their milestones (M6–M7); samurai-postinstall applies
# whatever the profile lists, from repos the ISO trusts.
install = [
    "samurai-release",
    "samurai-mirrorlist",
    "samurai-keyring",
    "qemu-guest-agent",
    "networkmanager",
    "wpa_supplicant",
]

[repos]
samurai = true
cachyos = true               # [cachyos] is baked into the ISO (linux-cachyos + keyring)
chaotic_aur = false
arch_mirror = "auto"         # "auto" = live medium mirrors; or an https URL to pin
                             # (spec 11: Arch archive for update-from-archive testing)

[security]
firewall = "firewalld"       # spec 09 / ADR-0006: deny inbound except DHCPv6 (ssh only with ssh_server)
ssh_server = false

[hardware]
nvidia = "auto"              # auto = install the NVIDIA stack only when an NVIDIA GPU is present
