# Autologin straight into Plasma. Wayland for SDDM itself too: with the default X11
# display server, stopping that server right after the autologin ends the new session
# (greeter appears instead of the desktop).
[General]
DisplayServer=wayland
GreeterEnvironment=QT_WAYLAND_SHELL_INTEGRATION=layer-shell

[Wayland]
CompositorCommand=kwin_wayland --drm --no-lockscreen --no-global-shortcuts --locale1

[Autologin]
User=live
Session=plasma
