# Samurai OS kernel hardening (spec 09, samurai-settings-security).
# Override a line in /etc/sysctl.d/99-local.conf; `samurai security status` reports the difference.
# Unprivileged user namespaces are deliberately left on: Flatpak, Steam's pressure-vessel and the
# browser sandboxes need them.

# Hide kernel addresses (breaks kernel symbols in `perf` for normal users).
kernel.kptr_restrict = 2
# Kernel log for root only (`sudo dmesg`).
kernel.dmesg_restrict = 1
# No BPF programs from unprivileged users; stays locked until reboot.
kernel.unprivileged_bpf_disabled = 1
net.core.bpf_jit_harden = 2
# A process may only ptrace its children (debuggers: attach with sudo). Wine and Proton are fine.
kernel.yama.ptrace_scope = 1
# No kexec (breaks kdump and `systemctl kexec`); stays locked until reboot.
kernel.kexec_load_disabled = 1
# Serial line disciplines load only for CAP_SYS_MODULE (exotic serial/CAN adapters run as root).
dev.tty.ldisc_autoload = 0
# No unprivileged userfaultfd (QEMU post-copy migration as a normal user needs it).
vm.unprivileged_userfaultfd = 0

# Link and file protections in sticky directories (scripts that append to another user's file in
# /tmp stop working).
fs.protected_symlinks = 1
fs.protected_hardlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2
# No core dumps from setuid programs (overrides systemd's 50-coredump.conf).
fs.suid_dumpable = 0

net.ipv4.tcp_syncookies = 1
# Loose reverse path filtering: strict mode breaks Tailscale and VPNs with asymmetric routes.
net.ipv4.conf.all.rp_filter = 2
net.ipv4.icmp_ignore_bogus_error_responses = 1

# Redirects: the kernel ORs conf/all with each interface's own value (while forwarding is off), so
# "all = 0" alone changes nothing. The globs set every present and future interface.
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.*.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv4.conf.*.secure_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv6.conf.*.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.*.send_redirects = 0
# Source routing needs conf/all AND the interface: "all = 0" is enough, default covers new ones.
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
