[nouveau]
desc = 'Nouveau open driver (Kepler and older NVIDIA cards)'
class_ids = "0300 0302"
vendor_ids = "10de"
device_ids = '>/var/lib/chwd/ids/nouveau.ids'
priority = 18
packages = 'mesa lib32-mesa opencl-mesa lib32-opencl-mesa'
conditional_packages = """
    # Vulkan and signed firmware only for Kepler
    device_id="$(lspci -d "10de:*:030x" -n | cut -d" " -f3 | cut -d":" -f2 | head -n1)"
    if grep -qw "$device_id" /var/lib/chwd/ids/nvidia-470.ids 2>/dev/null; then
        echo "vulkan-nouveau linux-firmware-nvidia"
    fi
"""
post_install = """
    mkdir -p /etc/profile.d /etc/environment.d
    echo "export RUSTICL_ENABLE=nouveau" > /etc/profile.d/opencl.sh
    echo "RUSTICL_ENABLE=nouveau" > /etc/environment.d/30-opencl.conf
"""
post_remove = """
    rm -f /etc/profile.d/opencl.sh /etc/environment.d/30-opencl.conf
"""

# chwd 1.25.0's nouveau.ids stops before Kepler (upstream still ships a 470xx
# profile there, which no repository of ours carries): Kepler uses nouveau.
[nouveau.kepler]
desc = 'Nouveau open driver with Vulkan (Kepler NVIDIA cards)'
device_ids = '>/var/lib/chwd/ids/nvidia-470.ids'

[intel]
desc = 'Mesa open source driver for Intel graphics'
class_ids = "0300 0302 0380"
vendor_ids = "8086"
device_ids = "*"
priority = 4
packages = 'mesa lib32-mesa vulkan-intel lib32-vulkan-intel gst-plugin-va linux-firmware-intel'
conditional_packages = """
    if [ -z "$(lspci -d "10de:*:030x")" ]; then
        echo "opencl-mesa lib32-opencl-mesa"
    fi
    device_id="$(lspci -d "8086:*:030x" -n | cut -d" " -f3 | cut -d":" -f2 | head -n1)"
    if grep -qw "$device_id" /var/lib/chwd/ids/intel-vaapi.ids 2>/dev/null; then
        echo "libva-intel-driver"
    else
        echo "intel-media-driver"
        if grep -qw "$device_id" /var/lib/chwd/ids/intel-media-sdk.ids 2>/dev/null; then
            echo "intel-media-sdk"
        else
            echo "vpl-gpu-rt"
        fi
    fi
"""
post_install = """
    if [ -z "$(lspci -d "10de:*:030x")" ]; then
        mkdir -p /etc/profile.d /etc/environment.d
        echo "export RUSTICL_ENABLE=iris" > /etc/profile.d/opencl.sh
        echo "RUSTICL_ENABLE=iris" > /etc/environment.d/30-opencl.conf
    fi
"""
post_remove = """
    rm -f /etc/profile.d/opencl.sh /etc/environment.d/30-opencl.conf
"""

