# Samurai OS graphics profiles for chwd (spec 07).
#
# Based on CachyOS chwd profiles/pci/graphic_drivers/profiles.toml (GPL-3.0),
# master @ 93a2117; the binary is tag 1.25.0. Changes: CachyOS-only packages removed (cachyos-drm-awaiter,
# nouveau-fw, libva-intel-driver-irql), kernel modules chosen per installed
# kernel, NVIDIA kernel parameters written through `samurai boot`.
#
# Rules (tests/unit/test_hw_profiles.py):
#  - `packages` holds only [A-Za-z0-9- ]: chwd's helper script cuts the list at
#    any other character.
#  - one module provider per branch: prebuilt modules only when every installed
#    kernel has one, else the DKMS package (it conflicts with the prebuilt ones).

[nvidia-open-dkms]
desc = 'NVIDIA open kernel modules (Turing and newer)'
class_ids = "0300 0302 0380"
vendor_ids = "10de"
device_ids = "*"
priority = 10
driver_conflict_group = "nvidia"
packages = 'nvidia-utils egl-wayland nvidia-settings opencl-nvidia lib32-opencl-nvidia lib32-nvidia-utils libva-nvidia-driver vulkan-icd-loader lib32-vulkan-icd-loader'
conditional_packages = """
    prebuilt=""
    headers=""
    dkms=0
    for pkgbase in /usr/lib/modules/*/pkgbase; do
        [ -r "$pkgbase" ] || continue
        kernel="$(cat "$pkgbase")"
        headers="$headers $kernel-headers"
        case "$kernel" in
            linux-cachyos) prebuilt="$prebuilt linux-cachyos-nvidia-open" ;;
            linux-cachyos-lts) prebuilt="$prebuilt linux-cachyos-lts-nvidia-open" ;;
            linux) prebuilt="$prebuilt nvidia-open" ;;
            linux-lts) prebuilt="$prebuilt nvidia-open-lts" ;;
            *) dkms=1 ;;
        esac
    done
    if [ "$dkms" = 1 ] || [ -z "$prebuilt" ]; then
        echo "dkms nvidia-open-dkms $headers"
    else
        echo "$prebuilt"
    fi
"""
pre_install = """
    mkdir -p /etc/mkinitcpio.conf.d
    cat <<'EOF' >/etc/mkinitcpio.conf.d/10-chwd-kms.conf
# This file is automatically generated by chwd. PLEASE DO NOT EDIT IT.
HOOKS=(${HOOKS[@]/kms/})
EOF
"""
pre_remove = """
    rm -f /etc/mkinitcpio.conf.d/10-chwd-kms.conf /etc/mkinitcpio.conf.d/11-samurai-nvidia.conf
"""
post_install = """
    cat <<'EOF' >/etc/mkinitcpio.conf.d/11-samurai-nvidia.conf
# This file is automatically generated by chwd. PLEASE DO NOT EDIT IT.
MODULES+=(nvidia nvidia_modeset nvidia_uvm nvidia_drm)
EOF
    samurai boot set param add nvidia_drm.modeset=1 || echo "WARNING: add nvidia_drm.modeset=1 by hand"
    samurai boot set param add nvidia_drm.fbdev=1 || echo "WARNING: add nvidia_drm.fbdev=1 by hand"
    systemctl enable nvidia-suspend.service nvidia-resume.service nvidia-hibernate.service
    mkinitcpio -P
"""
post_remove = """
    samurai boot set param remove nvidia_drm.modeset || true
    samurai boot set param remove nvidia_drm.fbdev || true
    mkinitcpio -P
"""

[nvidia-open-dkms.prime]
desc = 'NVIDIA open kernel modules for laptops (PRIME)'
priority = 11
packages = 'nvidia-utils egl-wayland nvidia-settings opencl-nvidia lib32-opencl-nvidia lib32-nvidia-utils libva-nvidia-driver vulkan-icd-loader lib32-vulkan-icd-loader nvidia-prime switcheroo-control'
chassis_types = "8 9 10 11 31"
post_install = """
    cat <<'EOF' >/etc/mkinitcpio.conf.d/11-samurai-nvidia.conf
# This file is automatically generated by chwd. PLEASE DO NOT EDIT IT.
MODULES+=(nvidia nvidia_modeset nvidia_uvm nvidia_drm)
EOF
    samurai boot set param add nvidia_drm.modeset=1 || echo "WARNING: add nvidia_drm.modeset=1 by hand"
    samurai boot set param add nvidia_drm.fbdev=1 || echo "WARNING: add nvidia_drm.fbdev=1 by hand"
    systemctl enable nvidia-suspend.service nvidia-resume.service nvidia-hibernate.service
    # nvidia-powerd is not supported by Turing GPUs
    if ! lspci -d "10de:*:030x" -vm | grep -q 'Device:.*TU'; then
        systemctl enable nvidia-powerd.service
    else
        cat <<'EOF' >/etc/modprobe.d/chwd-nvidia.conf
# This file is automatically generated by chwd. PLEASE DO NOT EDIT IT.
options nvidia NVreg_DynamicPowerManagement=0x02
EOF
    fi
    systemctl enable switcheroo-control.service
    mkinitcpio -P
"""
post_remove = """
    rm -f /etc/modprobe.d/chwd-nvidia.conf
    samurai boot set param remove nvidia_drm.modeset || true
    samurai boot set param remove nvidia_drm.fbdev || true
    mkinitcpio -P
"""

