[[app]]
category = "craft"
id = "filmcraft"
name = "FilmCraft (Premiere-style)"
packages = ["filmcraft"]
source = "chaotic"

[[app]]
category = "craft"
id = "lightcraft"
name = "LightCraft (Lightroom-style)"
packages = ["lightcraft"]
source = "chaotic"

[[app]]
category = "craft"
id = "effectcraft"
name = "EffectCraft (After Effects-style)"
packages = ["effectcraft"]
source = "chaotic"

[[app]]
category = "craft"
id = "designcraft"
name = "DesignCraft (InDesign-style)"
packages = ["designcraft"]
source = "chaotic"

[[app]]
category = "craft"
id = "pdfcraft"
name = "PdfCraft (Acrobat-style)"
