# Samurai OS install catalog: our choices on top of catalog/garuda-setup-wizard.toml (spec 08).
# The graphical installer, the terminal installer, the setup assistant and the toolbox all read
# these two files; `samurai apps` implements the merge (tests/unit/test_apps_catalog.py).
# Merge rules:
#   1. every Garuda [[app]] is loaded as-is (origin garuda; source "repo" = whichever enabled
#      repository has the package);
#   2. [[app]] here adds a new entry; reusing an existing id is an error (use [[override]]);
#   3. [[override]] with an id changes fields of that app (any field except id/origin); an
#      [[override]] with only a category changes every app of that category; an override that
#      matches nothing is an error;
#   4. [[choice]] defines single-select or multi-select groups (installer pages);
#   5. [[toggle]] defines the installer's default-on sets; [[bundle]] groups apps and toggles
#      for `samurai apps install @<bundle>` and the install-profile key `[packages] apps`;
#   6. [[category]] gives display names and order; [package_hints] names the repository a
#      package needs when it does not resolve (so the message can say "needs [multilib]").
# Unknown fields or tables are errors: a typo can never silently change what gets installed.
#
# source = where the package comes from, checked by CI against the live repos:
#   arch | multilib | cachyos | chaotic | samurai | flatpak | local-build | user-script
# Package names were checked against Arch, AUR and Chaotic-AUR on 2026-10-27.

