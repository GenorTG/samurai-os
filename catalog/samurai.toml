# ---------------------------------------------------------------- single/multi choices
[[choice]]
id = "desktop"
mode = "single"
default = "kde"
options = [
  { id = "kde", name = "KDE Plasma (Wayland)", meta = "samurai-desktop-kde", tested = true },
  { id = "gnome", name = "GNOME", meta = "", tested = false },
  { id = "xfce", name = "Xfce", meta = "", tested = false },
  { id = "lxqt", name = "LXQt", meta = "", tested = false },
  { id = "none", name = "No desktop (server / build your own)", meta = "", tested = true },
]

[[choice]]
id = "kernels"
mode = "multi"
default = ["linux-cachyos", "linux-zen"]
default_boot = "linux-cachyos"
options = [
  { id = "linux-cachyos", packages = ["linux-cachyos", "linux-cachyos-headers"], source = "cachyos" },
  { id = "linux-zen", packages = ["linux-zen", "linux-zen-headers"], source = "arch" },
  { id = "linux", packages = ["linux", "linux-headers"], source = "arch" },
  { id = "linux-lts", packages = ["linux-lts", "linux-lts-headers"], source = "arch" },
  { id = "linux-cachyos-lts", packages = ["linux-cachyos-lts", "linux-cachyos-lts-headers"], source = "cachyos" },
]

[[choice]]
id = "browsers"
mode = "multi"
default = ["firefox"]
# options = every app in category "browsers" (Garuda list) + the extras below

[[choice]]
id = "kde-theme"
mode = "single"
default = "breeze"   # Otto/Scratchy are not offered until their KDE Store licences are confirmed (spec 14)
when = "desktop == kde"
options = [
  { id = "breeze", name = "Breeze Dark (KDE default)", meta = "" },
]

[[choice]]
id = "conda"
mode = "single"
default = "miniforge"
options = [
  { id = "miniforge", name = "Miniforge (conda + mamba, conda-forge channel)", packages = ["samurai-miniforge"], source = "samurai" },
  { id = "none", name = "None (uv only)" },
]

[[choice]]
id = "firewall"
mode = "single"
default = "firewalld"
options = [
  { id = "firewalld", packages = ["firewalld", "plasma-firewall"], source = "arch" },
  { id = "ufw", packages = ["ufw", "plasma-firewall"], source = "arch" },
  { id = "none", name = "No firewall (not recommended)" },
]

# ---------------------------------------------------------------- defaults ON (toggleable)
[[toggle]]
id = "docker"
default = true
packages = ["docker", "docker-compose", "docker-buildx"]
services = ["docker.socket"]
user_groups = ["docker"]          # root-equivalent; separate checkbox "add me to the docker group", default on
source = "arch"

[[toggle]]
id = "tailscale"
default = true
packages = ["tailscale"]
services = ["tailscaled.service"]
firstboot = "welcome: Connect to Tailscale (runs `tailscale up`, opens the login URL)"
source = "arch"

# ---------------------------------------------------------------- optional (default off, installable later via toolbox)
[[choice]]
id = "reverse-proxy"
mode = "single"
default = "none"
options = [
  { id = "caddy", name = "Caddy (auto-HTTPS, simplest)", packages = ["caddy"], source = "arch" },
  { id = "nginx", name = "nginx", packages = ["nginx", "certbot"], source = "arch" },
  { id = "traefik", name = "traefik (Docker-native routing)", packages = ["traefik"], source = "arch" },
  { id = "none", name = "No reverse proxy" },
]  # samurai-reverse-proxy wraps the engine: sites-available/enabled + `samurai proxy` + toolbox page

[[toggle]]
id = "nvidia-cuda"
default = true
when = "gpu.nvidia && gpu.nvidia.generation >= turing"   # CUDA 13 no longer targets Maxwell/Pascal/Volta
packages = ["cuda", "cudnn", "nvtop"]
source = "arch"

[[toggle]]
id = "gpu-unlock"
default = true
when = "gpu.any_supported_by_gpu_unlock"                  # spec 07: recipe table read from the module source
packages = ["samurai-gpu-unlock"]                         # builder only; firmware is built on this machine
source = "samurai"

[[toggle]]
id = "kde-monitor-widgets"
default = true
when = "desktop == kde"

[[toggle]]
id = "python-versions"
default = false   # Genor 2026-11-17: every extra version is unticked; uv fetches missing ones
packages = ["uv", "samurai-python310", "samurai-python311", "samurai-python312", "samurai-python313"]
note = "python (3.14) from Arch core stays the system python"

[[toggle]]
id = "gaming"
default = true
packages = [
  "steam", "heroic-games-launcher-bin", "gamemode", "lib32-gamemode", "mangohud", "lib32-mangohud",
  "goverlay", "gamescope", "protontricks", "umu-launcher", "samurai-proton-ge", "proton-cachyos-slr",
  "samurai-wine",
  # proton-cachyos-slr: CachyOS split proton-cachyos into -native/-slr (checked 2026-11-21);
  # the Steam Linux Runtime build is the one Steam lists as a compatibility tool.
]

