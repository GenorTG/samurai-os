# ---------------------------------------------------------------- overrides of Garuda entries
[[override]]
id = "firefox"
default = true

[[override]]
id = "docker"
default = true   # also covered by the docker toggle

[[override]]
category = "kernels"
hidden = true    # the whole Garuda kernels category: kernels come from the "kernels" choice instead
note = "kernels come from the installer's kernel choice and `samurai kernel`"

# Data fixes found by `samurai apps check` against core/extra/cachyos/chaotic-aur (2026-11-21).
[[override]]
id = "intellijIdea"
name = "IntelliJ IDEA (open-source build)"
packages = ["intellij-idea-oss"]   # Arch renamed intellij-idea-community-edition

[[override]]
id = "xtreme"
packages = ["xdman"]               # xdman-beta-bin is gone; [cachyos] ships xdman

[[override]]
id = "asian"
packages = ["noto-fonts-cjk", "adobe-source-han-sans-otc-fonts", "adobe-source-han-serif-otc-fonts", "wqy-zenhei"]
# asian-fonts is a Garuda-repo meta package; these are its Arch equivalents

[[override]]
id = "virtualBox"
packages = ["virtualbox", "virtualbox-host-dkms", "virtualbox-guest-iso"]
# virtualbox-meta is Garuda-repo only; -dkms because our default kernels are cachyos/zen

[[override]]
id = "virtManager"
packages = ["virt-manager", "qemu-desktop", "libvirt", "dnsmasq", "edk2-ovmf", "swtpm"]
# virt-manager-meta is Garuda-repo only

[[override]]
id = "genymotion"
packages = ["genymotion", "virtualbox", "virtualbox-host-dkms"]   # virtualbox-meta: see above

[[override]]
id = "luanti"
packages = ["luanti", "luanti-server"]   # Arch [extra] ships Luanti; -git builds are dev snapshots

[[override]]
id = "firedragonCatppuccin"
hidden = true
note = "firedragon-catppuccin is only in Garuda's own repository"

[[override]]
id = "wire"
hidden = true
note = "wire-desktop is no longer packaged in Arch or Chaotic-AUR"

[[override]]
id = "nitroshare"
hidden = true
note = "nitroshare is AUR-only (not built by Chaotic-AUR)"

[[override]]
id = "bauh"
hidden = true
note = "bauh is AUR-only (not built by Chaotic-AUR)"

# ---------------------------------------------------------------- bundles (`samurai apps install @<id>`)
# Members that are not available on this system are skipped with a warning, never silently.
[[bundle]]
id = "gaming"
name = "Gaming"
description = "The installer's gaming set (Steam, Heroic, GameMode, MangoHud, gamescope, Proton) plus Lutris, GOverlay and ProtonUp-Qt."
toggles = ["gaming"]
apps = ["lutris", "goverlay", "protonup-qt"]

[[bundle]]
id = "dev"
name = "Development"
description = "Docker + Compose + buildx (installer default set), VS Code (OSS), Neovim, GitHub CLI, lazygit, Distrobox, uv."
toggles = ["docker"]
apps = ["visualStudioCodeOss", "neovim", "github-cli", "lazygit", "distrobox", "uv"]

[[bundle]]
id = "creative"
name = "Creative"
description = "Painting, photo, vector, 3D, video and audio editing."
apps = ["krita", "gimp", "inkscape", "blender", "darktable", "kdenlive", "audacity"]

[[bundle]]
id = "office"
name = "Office"
description = "LibreOffice, Thunderbird, Obsidian, KeePassXC."
apps = ["libreOfficeFresh", "thunderbird", "obsidian", "keepassXc"]

[[bundle]]
id = "media"
name = "Media"
description = "Video and music players plus HandBrake."
apps = ["vlc", "mpv", "strawberryPlayer", "handbrake"]

[[bundle]]
id = "streaming"
name = "Streaming"
description = "OBS Studio with game capture and virtual camera, EasyEffects, Streamlink."
apps = ["obsStudio", "obs-vkcapture", "v4l2loopback", "easyeffects", "streamlink"]
