# AI command-line tools (spec 13). One checkbox each; all updated by pacman.
[[app]]
category = "ai-cli"
id = "claude-code"
name = "Claude Code (Anthropic)"
packages = ["claude-code"]
source = "chaotic"
env = { DISABLE_AUTOUPDATER = "1" }     # pacman updates it

[[app]]
category = "ai-cli"
id = "codex"
name = "Codex CLI (OpenAI)"
packages = ["openai-codex-bin"]
source = "samurai"

[[app]]
category = "ai-cli"
id = "gemini-cli"
name = "Gemini CLI (Google)"
packages = ["gemini-cli"]
source = "arch"

[[app]]
category = "ai-cli"
id = "copilot-cli"
name = "GitHub Copilot CLI"
packages = ["github-copilot-cli"]
source = "chaotic"

[[app]]
category = "ai-cli"
id = "opencode"
name = "OpenCode"
packages = ["opencode-bin"]
source = "samurai"

[[app]]
category = "ai-cli"
id = "aider"
name = "Aider"
user_commands = ["uv tool install aider-chat"]
source = "user-script"

[[app]]
category = "ai-cli"
id = "cursor-cli"
name = "Cursor CLI"
user_commands = ["curl https://cursor.com/install -fsS | bash"]
source = "user-script"   # vendor installer; last resort, runs as the user, shows the URL first

[[app]]
category = "ai-local"
id = "ollama"
name = "Ollama (GPU build picked by driver profile)"
packages = ["ollama"]          # ollama-cuda / ollama-rocm substituted by the hardware step
services = ["ollama.service"]
source = "arch"

# ---------------------------------------------------------------- overrides of Garuda entries
[[override]]
id = "firefox"
default = true

[[override]]
id = "docker"
default = true   # also covered by the docker toggle

[[override]]
category = "kernels"
hidden = true    # the whole Garuda kernels category: kernels come from the "kernels" choice instead
