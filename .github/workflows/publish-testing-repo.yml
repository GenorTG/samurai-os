name: Publish Samurai testing repository

# Spec 02 steps 3-6 for the testing channel. Secrets live in the protected
# `samurai-testing` environment (docs/KEYS.md); forks and pull requests never
# trigger this workflow and could not read the environment if they did.
on:
  push:
    branches: [main]
    paths:
      - "pkgbuilds/**"
      - "updates/**"
      - "catalog/**"
      - "ci/build-repo.sh"
      - "ci/publish-repo.sh"
      - "ci/check-no-epoch"
      - "ci/check-no-shadowing"
      - "ci/reuse-published"
      - ".github/workflows/publish-testing-repo.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: samurai-testing-repository
  cancel-in-progress: false

jobs:
  publish-testing:
    if: github.repository == 'GenorTG/samurai-os' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: samurai-testing
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Check environment secrets
        id: secrets
        shell: bash
        env:
          HAS_KEY: ${{ secrets.SAMURAI_SIGNING_SUBKEY != '' }}
          HAS_TOKEN: ${{ secrets.SAMURAI_REPO_TOKEN != '' }}
        run: |
          # Until docs/KEYS.md's samurai-testing secrets exist, skip cleanly
          # instead of failing every push to main.
          if [ "$HAS_KEY" = true ] && [ "$HAS_TOKEN" = true ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::samurai-testing secrets not configured (docs/KEYS.md); skipping publish"
          fi

      - name: Check out source
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # The checkout is bind-mounted into the build container; never leave
          # GITHUB_TOKEN in .git/config where a PKGBUILD could read it.
          persist-credentials: false

      - name: Set monotonic testing package release
        if: steps.secrets.outputs.ready == 'true'
        shell: bash
        run: printf 'SAMURAI_PKGREL_OVERRIDE=%s%06d\n' "$(date -u +%Y%m%d)" "$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Import package signing subkey
        if: steps.secrets.outputs.ready == 'true'
        shell: bash
        env:
          SAMURAI_SIGNING_SUBKEY: ${{ secrets.SAMURAI_SIGNING_SUBKEY }}
        run: |
          set -euo pipefail
          test -n "$SAMURAI_SIGNING_SUBKEY"
          key_home="$HOME/samurai-keys/gnupg"
          install -d -m 700 "$key_home" "$HOME/samurai-keys"
          printf '%s\n' "$SAMURAI_SIGNING_SUBKEY" | gpg --batch --homedir "$key_home" --import 2>/dev/null
          # The primary fingerprint is pinned by the keyring package, not taken
          # from whatever the secret contains: a swapped secret fails here.
          primary_fingerprint="$(sed -n -E 's/^_primary_fpr=([0-9A-F]{40})[[:space:]]*$/\1/p' pkgbuilds/samurai-keyring/PKGBUILD | head -1)"
          test -n "$primary_fingerprint"
          gpg --batch --homedir "$key_home" --with-colons --list-secret-keys "$primary_fingerprint" | grep -q '^ssb:' ||
            { echo "::error::the SAMURAI_SIGNING_SUBKEY secret holds no secret subkey of $primary_fingerprint"; exit 1; }
          printf '%s\n' "$primary_fingerprint" > "$HOME/samurai-keys/primary-fingerprint.txt"

      - name: Build signed package repository
        if: steps.secrets.outputs.ready == 'true'
        run: ci/build-repo.sh build/repo

      - name: Publish complete repository to GitHub Releases
        if: steps.secrets.outputs.ready == 'true'
        shell: bash
        env:
          # fine-grained token, GenorTG/samurai-repo only, Contents read/write
          GH_TOKEN: ${{ secrets.SAMURAI_REPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          ci/publish-repo.sh build/repo x86_64-testing
